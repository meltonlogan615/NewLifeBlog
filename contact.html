    <header>
      <h1>I'm gonna leave this city, got to get away</h1>
      <p>All this fussing and fighting, man, you know I sure can't stay</p>

    <section class="">
      <article>
        <h2>Shout me a holler</h2>
        <p>I'm around and I don't bite.</p>

        <form action="">
          <label for="name" class="formLabel">
            Full Name:
          </label>

          <br>

          <input type="text" placeholder="Stan K. Nast, Esquire" width="50%" id="name" class="singleLineInput">

          <br>

          <label for="email" class="formLabel">
            Email:
          </label>

          <br>

          <input type="text" placeholder="stank.nasty@nasty.co" class="singleLineInput">
          <br>

          <label for="email" class="formLabel">
            Subject:
          </label>

          <br>

          <input type="text" placeholder="Wha'chu Need?" class="singleLineInput">

          <br>
          <label for="message" class="formLabel">
            Message:
          </label>

          <br>
          <textarea name="message" id="message" placeholder="Tell me something"></textarea>
          <!-- <input type="text" name="message" id="message" placeholder="Wha'chu gotta say?"> -->
          <input type="submit" value="Send" id="submitButton">
        </form>

      </article>
    </section>
